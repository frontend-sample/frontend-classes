name: Dependency security regressions

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install with the frozen lockfile and apply security patches
        run: npx --yes yarn@1.22.22 install --frozen-lockfile --non-interactive
      - name: Test security restrictions
        run: npm run test:security
      - name: Build assets
        run: npm run build
